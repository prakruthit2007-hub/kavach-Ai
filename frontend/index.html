<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kavach AI — Scam Detector</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #020617; color: #fff; min-height: 100vh; margin: 0; display: flex; justify-content: center; padding: 16px; }
    .container { width: 100%; max-width: 440px; }
    header { text-align: center; margin-bottom: 20px; }
    header h1 { margin: 8px 0 4px; font-size: 26px; font-weight: 800; }
    header h1 span { color: #ef4444; }
    header p { margin: 0; font-size: 13px; color: #94a3b8; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    label { font-size: 13px; font-weight: 600; color: #cbd5e1; margin: 0; }
    .clear-btn { background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }
    textarea, select { width: 100%; background: #020617; border: 1px solid #334155; border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
    .chip { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
    .upload-box { border: 1.5px dashed #334155; background: #020617; border-radius: 12px; padding: 12px; text-align: center; margin: 12px 0; cursor: pointer; }
    .upload-label { font-size: 13px; color: #cbd5e1; font-weight: 600; display: block; }
    .upload-sub { font-size: 11px; color: #64748b; display: block; margin-top: 2px; }
    #previewImg { max-width: 100%; max-height: 160px; border-radius: 8px; margin: 10px auto 0; display: none; }
    .btn-primary { width: 100%; background: #dc2626; color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; }
    .btn-primary:disabled { opacity: 0.6; }
    .result-card { display: none; border-radius: 16px; padding: 16px; border: 1px solid; }
    .result-high { display: block; background: rgba(127, 29, 29, 0.5); border-color: #dc2626; }
    .result-med { display: block; background: rgba(120, 53, 15, 0.5); border-color: #f59e0b; }
    .result-safe { display: block; background: rgba(6, 78, 59, 0.5); border-color: #10b981; }
    .badge { font-size: 17px; font-weight: 800; margin-bottom: 12px; display: block; }
    .reasons-box { background: rgba(0, 0, 0, 0.35); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.5; }
    .spoken-preview { font-size: 13px; color: #e2e8f0; background: rgba(255, 255, 255, 0.06); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    .btn-audio { width: 100%; background: rgba(255, 255, 255, 0.14); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .voice-status { font-size: 11px; color: #cbd5e1; text-align: center; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Kavach <span>AI</span></h1>
      <p>Vernacular UPI, SMS & Screenshot Scam Detector</p>
    </header>
    <div class="card">
      <div class="label-row">
        <label for="messageInput">Paste Message or Link</label>
        <button type="button" class="clear-btn" id="clearBtn">Clear All</button>
      </div>
      <textarea id="messageInput" rows="3" placeholder="Paste suspicious SMS, WhatsApp forward, or payment link..."></textarea>
      <div class="chips">
        <button type="button" class="chip" id="c1">⚡ Electricity Scam</button>
        <button type="button" class="chip" id="c2">🗣️ Kanglish KYC</button>
        <button type="button" class="chip" id="c3">💸 Fake UPI Prize</button>
        <button type="button" class="chip" id="c4">✅ Safe Bank SMS</button>
      </div>
      <div class="upload-box" id="uploadBox">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" />
        <span class="upload-label">📸 Or Upload Scam Screenshot / QR</span>
        <span class="upload-sub" id="fileNameLabel">Tap to select WhatsApp, SMS, or UPI payment screenshot</span>
        <img id="previewImg" alt="Screenshot preview" />
      </div>
      <div class="label-row" style="margin-top: 10px;">
        <label for="languageSelect">Preferred Language</label>
      </div>
      <select id="languageSelect">
        <option value="English">English (India)</option>
        <option value="Kannada">ಕನ್ನಡ (Kannada)</option>
        <option value="Hindi">हिंदी (Hindi)</option>
        <option value="Tamil">தமிழ் (Tamil)</option>
      </select>
      <button type="button" class="btn-primary" id="verifyBtn">Verify Now</button>
    </div>
    <div id="resultCard" class="result-card">
      <span id="riskBadge" class="badge"></span>
      <div class="reasons-box">
        <strong style="font-size: 11px; text-transform: uppercase; color: #cbd5e1;">Analysis Details:</strong>
        <ul id="reasonsList"></ul>
      </div>
      <div id="spokenPreview" class="spoken-preview"></div>
      <button type="button" class="btn-audio" id="audioBtn">🔊 Listen Aloud (Voice Alert)</button>
      <p id="voiceStatus" class="voice-status"></p>
    </div>
  </div>
  <script>
    let latestSpoken = "";
    const box = document.getElementById("messageInput");
    const imageInput = document.getElementById("imageInput");
    const previewImg = document.getElementById("previewImg");
    const fileNameLabel = document.getElementById("fileNameLabel");

    document.getElementById("uploadBox").onclick = () => imageInput.click();
    imageInput.onchange = () => {
      const file = imageInput.files[0];
      if (!file) return;
      box.value = "";
      fileNameLabel.innerText = "Selected: " + file.name;
      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = "block";
    };

    function setSample(txt) {
      imageInput.value = "";
      previewImg.style.display = "none";
      fileNameLabel.innerText = "Tap to select WhatsApp, SMS, or UPI payment screenshot";
      box.value = txt;
    }

    document.getElementById("clearBtn").onclick = () => {
      setSample("");
      document.getElementById("resultCard").className = "result-card";
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    };

    document.getElementById("c1").onclick = () => setSample("Dear Customer, your BESCOM electricity bill is pending. Pay now to avoid disconnection tonight. Click: http://bit.ly");
    document.getElementById("c2").onclick = () => setSample("Nimma SBI account KYC expire agide! Urgent update madi illandre account block agutte: http://tinyurl.com");
    document.getElementById("c3").onclick = () => setSample("Congratulations! You won Rs. 15,000 cashback. Approve UPI collect request on claimprize@okicici to receive money.");
    document.getElementById("c4").onclick = () => setSample("Rs.500.00 credited to A/c XX1234 via UPI Ref 6328192012. Thank you for banking with SBI.");

    document.getElementById("verifyBtn").onclick = async () => {
      const message = box.value.trim();
      const imageFile = imageInput.files[0];
      const language = document.getElementById("languageSelect").value;
      if (!message && !imageFile) return alert("Please paste a message, tap a sample, or upload a screenshot first.");
      if (window.speechSynthesis) window.speechSynthesis.cancel();

      const btn = document.getElementById("verifyBtn");
      btn.innerText = imageFile ? "Scanning Screenshot..." : "Scanning Message...";
      btn.disabled = true;

      try {
        let res;
        if (imageFile) {
          const fd = new FormData();
          fd.append("file", imageFile);
          fd.append("language", language);
          res = await fetch("/analyze-image", { method: "POST", body: fd });
        } else {
          res = await fetch("/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, language })
          });
        }

        let data = res.ok ? await res.json() : { use_ocr: Boolean(imageFile) };

        if (imageFile && data.use_ocr) {
          btn.innerText = "Reading Screenshot Text...";
          let extractedText = "";
          try {
            if (typeof Tesseract === "undefined") {
              await new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = "https://jsdelivr.net";
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
              });
            }
            const ocrResult = await Tesseract.recognize(imageFile, "eng");
            extractedText = (ocrResult.data.text || "").trim();
          } catch (ocrErr) {
            console.error(ocrErr);
          }

          if (extractedText) {
            const fallbackRes = await fetch("/analyze", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ message: extractedText, language })
            });
            data = await fallbackRes.json();
          } else {
            data = {
              risk_level: "Suspicious",
              reasons: ["Vision AI is temporarily busy. Please tap Verify Now again in a few seconds."],
              spoken_summary: "The image scanner is temporarily busy. Please try again in a few seconds."
            };
          }
        }

        const card = document.getElementById("resultCard");
        const badge = document.getElementById("riskBadge");
        card.className = "result-card " + (data.risk_level === "High Risk" ? "result-high" : data.risk_level === "Suspicious" ? "result-med" : "result-safe");
        badge.innerText = data.risk_level === "High Risk" ? "⚠️ HIGH RISK — SCAM DETECTED" : data.risk_level === "Suspicious" ? "⚠️ SUSPICIOUS" : "✅ SAFE — NO THREAT FOUND";
        document.getElementById("reasonsList").innerHTML = data.reasons.map(r => "<li>" + r + "</li>").join("");
        latestSpoken = data.spoken_summary;
        document.getElementById("spokenPreview").innerText = "Voice Summary: " + latestSpoken;
      } catch (e) {
        alert("Server error. Please check your connection.");
      } finally {
        btn.innerText = "Verify Now";
        btn.disabled = false;
      }
    };

    document.getElementById("audioBtn").onclick = () => {
      if (!latestSpoken || !window.speechSynthesis) return;
      if (window.speechSynthesis.speaking) { window.speechSynthesis.cancel(); return; }
      const langMap = { English: "en-IN", Kannada: "kn-IN", Hindi: "hi-IN", Tamil: "ta-IN" };
      const code = langMap[document.getElementById("languageSelect").value] || "en-IN";
      const u = new SpeechSynthesisUtterance(latestSpoken);
      u.lang = code;
      u.rate = 0.95;
      const voices = window.speechSynthesis.getVoices();
      const match = voices.find(v => v.lang.toLowerCase() === code.toLowerCase()) || voices.find(v => v.lang.toLowerCase().startsWith(code.slice(0, 2)));
      if (match) u.voice = match;
      document.getElementById("voiceStatus").innerText = match ? "Playing: " + match.name : "Playing: " + code;
      window.speechSynthesis.speak(u);
    };
  </script>
</body>
</html>
